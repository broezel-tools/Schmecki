<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schmecki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Schmecki-Liste</title>
<style>
:root{--paper:#f4efe6;--card:#fbf8f2;--ink:#2a2420;--mute:#7d746b;--line:#ddd4c6;--love:#b4442a;--like:#4a6b3a;--no:#2a2420;--warn:#e8b520}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px max(90px,env(safe-area-inset-bottom))}
h1{font:italic 400 38px/1.05 Georgia,"Times New Roman",serif;margin:12px 0 4px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 22px;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--ink)}
.addp{display:flex;gap:8px;margin-bottom:22px}
.btn{background:var(--ink);color:var(--paper);border-radius:10px;padding:0 18px;font-weight:600;white-space:nowrap;min-height:46px}
.btn.wide{width:100%}
.person{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;padding:16px 0;border-top:1px solid var(--line)}
.person:last-of-type{border-bottom:1px solid var(--line)}
.person b{font:400 24px Georgia,serif}
.cnt{font-size:13px;color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);font-style:italic;padding:14px 0}
.tip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin:0 0 20px;font-size:14px}
.tip p{margin:0 0 8px}
.tip button{text-decoration:underline;text-underline-offset:3px;margin-right:16px;padding:6px 0}
.tip .btn{text-decoration:none;padding:0 14px;min-height:40px;margin-right:12px}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.ghost{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--card);font-size:14px}
.note{font-size:12px;color:var(--mute);margin:10px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.back{font-size:15px;color:var(--mute);padding:8px 0}
.dellink{font-size:13px;color:var(--love);padding:8px 0}
#pname{font:400 30px Georgia,serif;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:6px 0}
.warn{margin-top:12px;padding:10px 12px;background:#fbefc2;border:1px solid var(--warn);border-radius:10px;font-size:14px}
.lbl{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 4px}
#pnote{font-size:15px;min-height:46px;resize:vertical}
.tabs{display:flex;margin:20px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px 2px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;font-size:14px;line-height:1.2}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.help{font-size:14px;color:var(--mute);margin:0 0 12px}
.grp{margin-bottom:20px}
.grp h3{margin:0 0 8px;font:italic 400 20px Georgia,serif}
.grp.love h3{color:var(--love)}.grp.like h3{color:var(--like)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px 13px;font-size:15px}
.chip:after{content:" ×";color:var(--mute)}
.grp.allergy .chip{background:#fbefc2;border-color:var(--warn)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:14px;color:var(--mute)}
.cats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.frow{padding:12px 0;border-top:1px solid var(--line)}
.fname{min-width:0;flex:1;overflow-wrap:anywhere}
.frow .fname{margin-bottom:8px}
.fname small{display:block;color:var(--mute);font-size:12px}
.fname small button{text-decoration:underline;margin-left:8px;padding:4px 0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 2px}
.seg i{font-style:normal;font-size:20px;line-height:1}
.seg span{font-size:11px;line-height:1;font-weight:600}
.seg button.love.on{background:var(--love);border-color:var(--love);color:#fff}
.seg button.like.on{background:var(--like);border-color:var(--like);color:#fff}
.seg button.dislike.on{background:var(--no);border-color:var(--no);color:var(--paper)}
.seg button.allergy.on{background:var(--warn);border-color:var(--warn);color:var(--ink)}
.addrow{width:100%;text-align:left;padding:14px;margin:6px 0 10px;border:1.5px dashed var(--ink);border-radius:12px;font-weight:600}
.sugg{font:italic 400 18px Georgia,serif;margin:10px 0 0}
.pend{border:1.5px solid var(--ink);border-radius:14px;padding:14px;background:var(--card)}
.pend p{margin:0 0 12px}
.cancel{display:block;margin:14px auto 0;color:var(--mute);text-decoration:underline;padding:6px}
.gform{margin-bottom:18px}
.gform input{margin-bottom:8px}
.gh{margin:20px 0 4px;font:italic 400 18px Georgia,serif;color:var(--mute)}
.grow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.chk{flex:none;width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;font-size:20px;line-height:1}
.grow.done .chk{background:var(--ink);color:var(--paper)}
.grow.done .fname{text-decoration:line-through;color:var(--mute)}
.x{width:44px;height:44px;font-size:24px;color:var(--mute);flex:none}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:max(20px,env(safe-area-inset-bottom));transform:translateY(20px);background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;font-size:15px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;z-index:9}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast button{text-decoration:underline;font-weight:600;white-space:nowrap;padding:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
const KEY='schmecki-liste-v1',MKEY='schmecki-liste-meta',DAY=864e5;
const FOODS={
"Gemüse":"Tomate,Gurke,Paprika,Zucchini,Aubergine,Karotte,Kartoffel,Süßkartoffel,Zwiebel,Knoblauch,Lauch,Frühlingszwiebel,Brokkoli,Blumenkohl,Rosenkohl,Weißkohl,Rotkohl,Spitzkohl,Grünkohl,Wirsing,Spinat,Mangold,Feldsalat,Eisbergsalat,Rucola,Kopfsalat,Radieschen,Rote Bete,Sellerie,Staudensellerie,Fenchel,Kohlrabi,Spargel,Mais,Erbsen,Grüne Bohnen,Champignons,Pfifferlinge,Steinpilze,Austernpilze,Oliven,Kürbis,Pastinake,Artischocke,Avocado,Chicorée,Ingwer,Meerrettich",
"Obst":"Apfel,Birne,Banane,Orange,Mandarine,Zitrone,Limette,Grapefruit,Erdbeere,Himbeere,Heidelbeere,Brombeere,Johannisbeere,Stachelbeere,Kirsche,Pflaume,Zwetschge,Pfirsich,Nektarine,Aprikose,Weintraube,Honigmelone,Wassermelone,Ananas,Mango,Kiwi,Papaya,Granatapfel,Feige,Dattel,Rosinen,Maracuja,Litschi,Kokosnuss,Rhabarber,Cranberry",
"Fleisch & Fisch":"Rindfleisch,Hackfleisch,Schweinefleisch,Schnitzel,Steak,Bratwurst,Currywurst,Leberwurst,Salami,Schinken,Speck,Leberkäse,Mettwurst,Gyros,Hähnchen,Hähnchenkeule,Pute,Ente,Gans,Lamm,Wild,Kaninchen,Leber,Innereien,Fleischwurst,Frikadelle,Kassler,Rippchen,Haxe,Lachs,Forelle,Thunfisch,Kabeljau,Seelachs,Matjes,Hering,Räucherfisch,Garnelen,Muscheln,Tintenfisch,Krabben,Fischstäbchen,Sushi,Rollmops,Sardinen,Räucherlachs",
"Milch & Eier":"Milch,Sahne,Joghurt,Quark,Frischkäse,Butter,Käse,Gouda,Emmentaler,Mozzarella,Parmesan,Feta,Camembert,Blauschimmelkäse,Ziegenkäse,Schafskäse,Mascarpone,Ricotta,Halloumi,Schmand,Buttermilch,Kefir,Ei,Rührei,Spiegelei,Gekochtes Ei",
"Getreide & Beilagen":"Nudeln,Spaghetti,Reis,Basmatireis,Risotto,Couscous,Bulgur,Quinoa,Hirse,Haferflocken,Müsli,Brot,Brötchen,Vollkornbrot,Baguette,Toast,Brezel,Pommes,Kroketten,Kartoffelbrei,Bratkartoffeln,Knödel,Spätzle,Gnocchi,Polenta,Pizza,Wraps,Tortilla,Fladenbrot,Maultaschen,Pfannkuchen,Reibekuchen,Croissant,Sauerteigbrot",
"Hülsenfrüchte & Nüsse":"Linsen,Kichererbsen,Kidneybohnen,Weiße Bohnen,Sojabohnen,Tofu,Tempeh,Erdnüsse,Walnüsse,Haselnüsse,Mandeln,Cashews,Pistazien,Sonnenblumenkerne,Kürbiskerne,Sesam,Leinsamen,Erdnussbutter,Hummus,Edamame",
"Kräuter, Gewürze & Soßen":"Petersilie,Basilikum,Koriander,Dill,Schnittlauch,Minze,Thymian,Rosmarin,Oregano,Salbei,Liebstöckel,Bärlauch,Chili,Scharfes Essen,Pfeffer,Curry,Paprikapulver,Kreuzkümmel,Zimt,Vanille,Muskat,Kardamom,Senf,Ketchup,Mayonnaise,Essig,Sojasoße,Pesto,Tomatensoße,Sauce Hollandaise,Béchamel,Honig,Marmelade,Nutella,Knoblauchsoße,Tzatziki,Guacamole,Sauerkraut,Gewürzgurken,Kapern,Wasabi,Barbecuesoße",
"Süßes & Snacks":"Schokolade,Zartbitterschokolade,Vollmilchschokolade,Weiße Schokolade,Eis,Vanilleeis,Kuchen,Käsekuchen,Apfelkuchen,Torte,Kekse,Waffeln,Muffins,Brownies,Donuts,Gummibärchen,Lakritz,Marzipan,Nougat,Popcorn,Chips,Salzstangen,Müsliriegel,Pralinen,Bonbons,Tiramisu,Panna Cotta,Mousse au Chocolat,Rote Grütze,Milchreis,Grießbrei,Kaiserschmarrn,Apfelstrudel,Crêpes,Lebkuchen,Plätzchen",
"Getränke":"Kaffee,Tee,Kräutertee,Grüner Tee,Kakao,Wasser,Sprudelwasser,Cola,Limonade,Apfelschorle,Orangensaft,Bier,Weißbier,Radler,Wein,Rotwein,Weißwein,Sekt,Whisky,Gin,Cocktails,Energy Drink",
"Gerichte":"Lasagne,Spaghetti Bolognese,Spaghetti Carbonara,Burger,Döner,Falafel,Chili con Carne,Gulasch,Rouladen,Sauerbraten,Eintopf,Erbsensuppe,Linsensuppe,Tomatensuppe,Gemüsesuppe,Hühnersuppe,Kartoffelsuppe,Kartoffelsalat,Nudelsalat,Salat,Flammkuchen,Quiche,Auflauf,Ofengemüse,Raclette,Fondue,Grillfleisch,Pulled Pork,Spareribs,Tacos,Burrito,Pad Thai,Ramen,Paella,Himmel un Ääd,Mettbrötchen,Fischbrötchen"
};

/* Suche: tolerant gegenüber Umlauten, Akzenten, h, Doppelbuchstaben */
function norm(s){
  s=String(s).toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
  s=s.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u').replace(/ph/g,'f');
  s=s.replace(/[^a-z0-9]/g,'').replace(/h/g,'').replace(/y/g,'i').replace(/c/g,'k');
  return s.replace(/(.)\1+/g,'$1');
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
function mk(name,cat){return {name,cat,key:name.toLowerCase(),n:norm(name),tok:name.split(/\s+/).map(norm).filter(Boolean)}}
const BASE=[],seen=new Set();
for(const cat in FOODS)FOODS[cat].split(',').forEach(n=>{n=n.trim();const f=mk(n,cat);if(n&&!seen.has(f.key)){seen.add(f.key);BASE.push(f)}});
function fuzzy(nq,foods){
  const lim=nq.length>=8?2:1,out=[];
  for(const f of foods){
    const cands=[f.n,...f.tok];let best=9;
    for(const c of cands)best=Math.min(best,lev(nq,c),lev(nq,c.slice(0,nq.length)));
    if(best<=lim)out.push([best,f]);
  }
  return out.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name,'de')).slice(0,5).map(x=>x[1]);
}

let S={people:[],custom:[]},M={};
try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);if(j&&Array.isArray(j.people)){S=j;if(!Array.isArray(S.custom))S.custom=[]}}}catch(e){}
try{M=JSON.parse(localStorage.getItem(MKEY))||{}}catch(e){M={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(M))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const ST=[['love','😍','Liebt'],['like','🙂','Mag'],['dislike','🚫','Mag nicht'],['allergy','⚠️','Allergie']];
const GORDER=['allergy','love','like','dislike'];
const GTITLE={allergy:'⚠️ Allergie / Unverträglich',love:'😍 Liebt',like:'🙂 Mag',dislike:'🚫 Mag nicht'};
const ui={view:'list',pid:null,tab:'add',q:'',cat:'',pending:null};
const person=()=>S.people.find(p=>p.id===ui.pid);
const allFoods=()=>BASE.concat(S.custom.map(n=>mk(n,'Eigene')));
const nameOf=k=>{const f=allFoods().find(x=>x.key===k);return f?f.name:k};
const pn=p=>p.name||'dieser Person';
const counts=p=>{const c={love:0,like:0,dislike:0,allergy:0};Object.values(p.items).forEach(v=>{if(c[v]!==undefined)c[v]++});return c};

/* Hinweis-Einblendung mit Rückgängig */
let toastT,undoCb=null;
function toast(msg,undo){
  const t=$('#toast');undoCb=undo||null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Rückgängig</button>':'');
  t.className='show';clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';undoCb=null},5000);
}
function withUndo(msg,fn){
  const snap=JSON.stringify(S);fn();save();
  toast(msg,()=>{S=JSON.parse(snap);save();render()});
}

/* Sicherung */
function nextNo(){return ((M.backupNo||0)%999)+1}
function backupName(n){return 'Schmecki_'+String(n).padStart(3,'0')+'_'+new Date().getFullYear()+'.json'}
function backup(){
  const n=nextNo(),name=backupName(n);
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');
  l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  M.backupNo=n;M.lastBackup=Date.now();M.lastName=name;saveMeta();
  render();toast('Gespeichert als '+name);
}
function dataSize(){return S.people.reduce((n,p)=>n+Object.keys(p.items).length+(p.gifts||[]).length,0)}
function tipHTML(){
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(/^https?:/.test(location.protocol)&&!standalone&&!M.installSeen)
    return '<div class="tip"><p><b>Tipp:</b> Damit sich die Liste wie eine App öffnet, im Browser-Menü <b>„Zum Home-Bildschirm“</b> wählen.</p><button data-act="tipinstall">Verstanden</button></div>';
  if(dataSize()>=5&&(!M.lastBackup||Date.now()-M.lastBackup>14*DAY)&&!(M.snooze&&Date.now()<M.snooze))
    return '<div class="tip"><p><b>Speichern:</b> '+(M.lastBackup?'Zuletzt gespeichert vor über zwei Wochen.':'Die Liste wurde noch nie gespeichert.')+' Speichere sie, damit nichts verloren geht.</p><button class="btn" data-act="export">Jetzt speichern</button><button data-act="snooze">Später</button></div>';
  return '';
}

/* Ansichten */
function segHTML(cur,k){
  return '<div class="seg">'+ST.map(([s,ic,lb])=>'<button class="'+s+(cur===s?' on':'')+'" data-act="'+(k===null?'setpending':'set')+'"'+(k!==null?' data-k="'+esc(k)+'"':'')+' data-s="'+s+'" aria-pressed="'+(cur===s)+'"><i>'+ic+'</i><span>'+lb+'</span></button>').join('')+'</div>';
}
function listHTML(){
  const ppl=[...S.people].sort((a,b)=>a.name.localeCompare(b.name,'de'));
  return '<h1>Schmecki-Liste</h1><p class="sub">Wer mag was – und was lieber nicht.</p>'+tipHTML()+
  '<form class="addp" data-form="newperson"><input id="newname" placeholder="Neue Person …" autocomplete="off"><button class="btn" type="submit">Anlegen</button></form>'+
  (ppl.length?ppl.map(p=>{const c=counts(p);return '<button class="person" data-act="open" data-id="'+p.id+'"><b>'+esc(p.name||'Ohne Name')+'</b><span class="cnt">'+(c.allergy?'⚠️ '+c.allergy+' · ':'')+'😍 '+c.love+' · 🙂 '+c.like+' · 🚫 '+c.dislike+'</span></button>'}).join(''):'<div class="empty">Noch keine Personen angelegt.</div>')+
  '<div class="foot"><button class="ghost" data-act="export">Speichern</button><button class="ghost" data-act="import">Wiederherstellen</button></div>'+
  '<p class="note">'+(M.lastBackup?'Zuletzt gespeichert: '+new Date(M.lastBackup).toLocaleDateString('de-DE')+(M.lastName?' ('+esc(M.lastName.replace('.json',''))+')':''):'Noch nicht gespeichert.')+'</p>';
}
function tabsHTML(p){
  const T=[['add','Essen eintragen'],['over','Übersicht ('+Object.keys(p.items).length+')'],['gifts','Geschenke ('+(p.gifts||[]).length+')']];
  return T.map(([t,l])=>'<button data-act="tab" data-t="'+t+'" class="'+(ui.tab===t?'on':'')+'">'+l+'</button>').join('');
}
function warnHTML(p){
  const ks=Object.keys(p.items).filter(k=>p.items[k]==='allergy').map(nameOf).sort((a,b)=>a.localeCompare(b,'de'));
  return ks.length?'<div class="warn">⚠️ <b>Allergie / Unverträglich:</b> '+ks.map(esc).join(', ')+'</div>':'';
}
function refreshHead(){const p=person();if(!p)return;$('#tabs').innerHTML=tabsHTML(p);$('#warn').innerHTML=warnHTML(p)}
function giftRow(x){
  return '<div class="grow'+(x.done?' done':'')+'"><button class="chk" data-act="togglegift" data-id="'+x.id+'" aria-label="'+(x.done?'Wieder offen':'Als verschenkt markieren')+'">'+(x.done?'✓':'')+'</button><div class="fname">'+esc(x.text)+(x.occasion?'<small>'+esc(x.occasion)+'</small>':'')+'</div><button class="x" data-act="delgift" data-id="'+x.id+'" aria-label="Entfernen">×</button></div>';
}
function personHTML(){
  const p=person();let body='';
  if(ui.tab==='over'){
    const g=GORDER.map(s=>{
      const ks=Object.keys(p.items).filter(k=>p.items[k]===s).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'de'));
      return ks.length?'<div class="grp '+s+'"><h3>'+GTITLE[s]+'</h3><div class="chips">'+ks.map(k=>'<button class="chip" data-act="clear" data-k="'+esc(k)+'">'+esc(nameOf(k))+'</button>').join('')+'</div></div>':'';
    }).join('');
    body='<p class="help">Alles, was bei '+esc(pn(p))+' eingetragen ist. Antippen entfernt einen Eintrag.</p>'+(g||'<div class="empty">Noch nichts eingetragen – im Reiter „Essen eintragen“ suchen.</div>');
  }else if(ui.tab==='gifts'){
    const g=p.gifts||[],open=g.filter(x=>!x.done),done=g.filter(x=>x.done);
    body='<p class="help">Ideen für '+esc(pn(p))+' – einfach notieren und später abhaken.</p>'+
    '<form class="gform" data-form="newgift"><input id="newgift" placeholder="Geschenkidee …" autocomplete="off"><input id="giftocc" placeholder="Anlass / Datum (optional)" autocomplete="off"><button class="btn wide" type="submit">＋ Idee speichern</button></form>'+
    (open.length?open.map(giftRow).join(''):(done.length?'':'<div class="empty">Noch keine Geschenkideen.</div>'))+
    (done.length?'<h3 class="gh">Schon verschenkt</h3>'+done.map(giftRow).join(''):'');
  }else{
    const cats=['',...Object.keys(FOODS),...(S.custom.length?['Eigene']:[])];
    body='<p class="help">Suche etwas und tippe an, wie '+esc(pn(p))+' dazu steht.</p>'+
    '<input id="q" type="search" placeholder="Lebensmittel oder Gericht suchen …" autocomplete="off" value="'+esc(ui.q)+'">'+
    '<div class="cats">'+cats.map(c=>'<button data-act="cat" data-c="'+esc(c)+'" class="'+(ui.cat===c?'on':'')+'">'+(c||'Alle')+'</button>').join('')+'</div><div id="res"></div>';
  }
  return '<div class="top"><button class="back" data-act="back">‹ Alle Personen</button><button class="dellink" data-act="delperson">Person löschen</button></div>'+
  '<input id="pname" value="'+esc(p.name)+'" placeholder="Name" autocomplete="off">'+
  '<div id="warn">'+warnHTML(p)+'</div>'+
  '<label class="lbl" for="pnote">Notiz</label><textarea id="pnote" rows="2" placeholder="z. B. Lieblingsgericht, Besonderheiten …">'+esc(p.note||'')+'</textarea>'+
  '<div class="tabs" id="tabs">'+tabsHTML(p)+'</div>'+body;
}
function foodRow(f,cur){
  return '<div class="frow"><div class="fname">'+esc(f.name)+'<small>'+esc(f.cat)+(f.cat==='Eigene'?'<button data-act="delcustom" data-k="'+esc(f.key)+'">entfernen</button>':'')+'</small></div>'+segHTML(cur,f.key)+'</div>';
}
function renderResults(){
  const el=$('#res');if(!el)return;
  const p=person();
  if(ui.pending){
    el.innerHTML='<div class="pend"><p><b>„'+esc(ui.pending)+'“</b> – wie ist das bei '+esc(pn(p))+'?</p>'+segHTML(null,null)+'<button class="cancel" data-act="cancelpending">Abbrechen</button></div>';
    return;
  }
  const nq=norm(ui.q.trim()),foods=allFoods().filter(f=>!ui.cat||f.cat===ui.cat);
  const list=nq?foods.filter(f=>f.n.includes(nq)):foods.slice();
  list.sort((a,b)=>((b.n.startsWith(nq)?1:0)-(a.n.startsWith(nq)?1:0))||a.name.localeCompare(b.name,'de'));
  const sugg=(nq&&!list.length&&nq.length>=4)?fuzzy(nq,foods):[];
  const exact=nq&&allFoods().some(f=>f.n===nq);
  let h='';
  if(sugg.length){
    h+='<p class="sugg">Meintest du …?</p>'+sugg.map(f=>foodRow(f,p.items[f.key])).join('');
    h+='<button class="addrow" data-act="addcustom">Nein, „'+esc(ui.q.trim())+'“ neu anlegen</button>';
  }else{
    if(nq&&!exact)h+='<button class="addrow" data-act="addcustom">＋ „'+esc(ui.q.trim())+'“ hinzufügen</button>';
    h+=list.map(f=>foodRow(f,p.items[f.key])).join('');
    if(!list.length&&!nq)h+='<div class="empty">Nichts gefunden.</div>';
  }
  el.innerHTML=h;
}
function render(){
  $('#app').innerHTML=ui.view==='list'?listHTML():personHTML();
  if(ui.view==='person'&&ui.tab==='add')renderResults();
}

/* Ereignisse */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,p=ui.view==='person'?person():null;
  if(a==='undo'){const f=undoCb;undoCb=null;$('#toast').className='';if(f)f();return}
  if(a==='open'){ui.view='person';ui.pid=t.dataset.id;const pp=person();ui.tab=Object.keys(pp.items).length?'over':'add';ui.q='';ui.cat='';ui.pending=null;render();window.scrollTo(0,0)}
  else if(a==='back'){ui.view='list';render()}
  else if(a==='tab'){ui.tab=t.dataset.t;ui.pending=null;render()}
  else if(a==='cat'){ui.cat=t.dataset.c;ui.pending=null;render()}
  else if(a==='set'){
    const k=t.dataset.k,s=t.dataset.s;
    if(p.items[k]===s)withUndo('„'+nameOf(k)+'“ zurückgenommen',()=>{delete p.items[k]});
    else{p.items[k]=s;save()}
    renderResults();refreshHead();
  }
  else if(a==='clear'){const k=t.dataset.k;withUndo('„'+nameOf(k)+'“ entfernt',()=>{delete p.items[k]});render()}
  else if(a==='addcustom'){const n=ui.q.trim().replace(/\s+/g,' ');if(!n)return;ui.pending=n;renderResults();window.scrollTo(0,0)}
  else if(a==='cancelpending'){ui.pending=null;renderResults()}
  else if(a==='setpending'){
    const name=ui.pending;if(!name)return;
    const f=allFoods().find(x=>x.n===norm(name));let key;
    if(f)key=f.key;else{S.custom.push(name);key=name.toLowerCase()}
    p.items[key]=t.dataset.s;save();ui.pending=null;ui.q='';
    const qi=$('#q');if(qi)qi.value='';
    renderResults();refreshHead();toast('„'+name+'“ gespeichert');
  }
  else if(a==='delcustom'){const k=t.dataset.k;if(!confirm('Eigenen Eintrag „'+nameOf(k)+'“ für alle Personen entfernen?'))return;S.custom=S.custom.filter(n=>n.toLowerCase()!==k);S.people.forEach(x=>delete x.items[k]);if(ui.cat==='Eigene'&&!S.custom.length)ui.cat='';save();render()}
  else if(a==='delperson'){if(!confirm('„'+(p.name||'Ohne Name')+'“ wirklich löschen?'))return;S.people=S.people.filter(x=>x.id!==p.id);save();ui.view='list';render()}
  else if(a==='togglegift'){const x=(p.gifts||[]).find(g=>g.id===t.dataset.id);if(x){x.done=!x.done;save();render()}}
  else if(a==='delgift'){withUndo('Idee entfernt',()=>{p.gifts=(p.gifts||[]).filter(x=>x.id!==t.dataset.id)});render()}
  else if(a==='export'){backup()}
  else if(a==='import'){$('#imp').click()}
  else if(a==='tipinstall'){M.installSeen=true;saveMeta();render()}
  else if(a==='snooze'){M.snooze=Date.now()+3*DAY;saveMeta();render()}
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;
  if(f==='newperson'){
    e.preventDefault();const n=$('#newname').value.trim();if(!n)return;
    const p={id:uid(),name:n,note:'',items:{},gifts:[]};S.people.push(p);save();
    ui.view='person';ui.pid=p.id;ui.tab='add';ui.q='';ui.cat='';ui.pending=null;render();window.scrollTo(0,0);
  }else if(f==='newgift'){
    e.preventDefault();const p=person(),n=$('#newgift').value.trim().replace(/\s+/g,' '),o=$('#giftocc').value.trim();if(!n||!p)return;
    (p.gifts||(p.gifts=[])).unshift({id:uid(),text:n,occasion:o,done:false});save();render();$('#newgift').focus();
  }
});
document.addEventListener('input',e=>{
  const p=ui.view==='person'?person():null;
  if(e.target.id==='pname'&&p){p.name=e.target.value;save()}
  else if(e.target.id==='pnote'&&p){p.note=e.target.value;save()}
  else if(e.target.id==='q'){ui.q=e.target.value;ui.pending=null;renderResults()}
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!j||!Array.isArray(j.people))throw 0;
      if(!confirm('Die aktuelle Liste durch den gespeicherten Stand ersetzen ('+j.people.length+' Personen)?'))return;
      j.people.forEach(p=>{p.id=p.id||uid();p.items=p.items||{};p.note=p.note||'';p.gifts=Array.isArray(p.gifts)?p.gifts:[]});
      S={people:j.people,custom:Array.isArray(j.custom)?j.custom:[]};save();const mm=/^Schmecki_(\d{3})_/.exec(f.name);if(mm){M.backupNo=Math.max(M.backupNo||0,+mm[1]);saveMeta()}ui.view='list';render();toast('Wiederhergestellt');
    }catch(err){alert('Die Datei konnte nicht gelesen werden.')}
  };
  r.readAsText(f);e.target.value='';
});

/* App-Icon und Manifest für den Home-Bildschirm */
(function(){try{
  const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');
  x.fillStyle='#2a2420';x.fillRect(0,0,192,192);
  x.fillStyle='#f4efe6';x.font='italic 120px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('S',96,92);
  x.fillStyle='#b4442a';x.fillRect(60,148,72,7);
  const url=c.toDataURL('image/png');
  [['apple-touch-icon',url],['icon',url]].forEach(([rel,href])=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)});
  if(/^https?:/.test(location.protocol)){
    const m={name:'Schmecki-Liste',short_name:'Schmecki',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f4efe6',theme_color:'#f4efe6',icons:[{src:url,sizes:'192x192',type:'image/png'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
  }
}catch(e){}})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
